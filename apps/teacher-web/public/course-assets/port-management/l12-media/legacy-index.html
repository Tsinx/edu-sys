<details><summary>资料来源</summary><div id="sources"></div></details></main><script>
const video=document.querySelector('#film');video.addEventListener('error',()=>document.querySelector('#error').textContent='影片暂未加载，请刷新页面，或下载MP4后用本机播放器打开。');
fetch('storyboard.json').then(r=>r.json()).then(data=>{for(const shot of data.shots){const button=document.createElement('button');button.textContent=`${String(Math.floor(shot.from/60)).padStart(2,'0')}:${String(shot.from%60).padStart(2,'0')} · ${shot.title}`;button.addEventListener('click',()=>{video.pause();video.currentTime=shot.from;});document.querySelector('#chapters').append(button);const p=document.createElement('p');p.textContent=button.textContent+'：'+shot.narration;document.querySelector('#transcript').append(p);}for(const source of data.sources){const p=document.createElement('p'),a=document.createElement('a');a.href=source.url;a.textContent=source.title;a.target='_blank';a.rel='noreferrer';p.append(a,document.createTextNode(' · '+source.boundary));document.querySelector('#sources').append(p);}}).catch(()=>document.querySelector('#error').textContent='镜头目录未加载；影片仍可直接播放。');
</script></body></html>
